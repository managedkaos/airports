<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Airports</title>
  <meta name="description" content="Sign in to explore airport locations, current local times, and weekend status.">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<header class="navbar">
  <a href="/login" class="nav-brand"><span class="brand-icon" aria-hidden="true">✈</span><span class="brand-title">Airports</span></a>
</header>
<main class="main-content auth-main">
  <section class="card auth-card" aria-labelledby="authTitle">
    <div class="auth-body">
      <h1 id="authTitle">Sign in to Airports</h1>
      <p class="auth-subtitle">Airport locations, local times, time zones, and weekend status — in a table and an interactive 3D globe.</p>
      <button id="googleSignInBtn" type="button" class="google-signin-btn">
        <span class="google-mark" aria-hidden="true">G</span> Sign in with Google
      </button>
      <p id="authStatus" class="auth-status" role="status" aria-live="polite"></p>
      <p id="authError" class="auth-error" role="alert" hidden></p>
    </div>
  </section>
</main>
<footer class="app-footer">Access requires a Google sign-in.</footer>

<!-- Firebase compat SDK: exposes a global `firebase` so plain script tags work. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
